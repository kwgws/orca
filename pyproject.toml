[project]
name = "orca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12, <4"
dependencies = [
    "grandalf >=0.8, <1",
    "langchain-chroma >=0.2, <0.3",
    "langchain-community >=0.3, <0.4",
    "langchain-ollama >=0.3, <0.4",
    "langgraph >=0.5, <1",
    "regex >= 2024",
    "wikipedia >=1.4, <2",
]

[project.urls]
Repository = "https://github.com/kwgws/orca.git"

[dependency-groups]
dev = [
    "pytest >=8.4",
    "pytest-asyncio >=1",
    "ruff >=0.12, <1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
lint.select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "B",  # Bugbear
    "I",  # isort
    "UP", # pyupgrade
    "RUF" # Ruff-specific goodies
]

[tool.pytest.ini_options]
pythonpath = ["src"]