[project]
name = "orca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "wikipedia",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 80
target-version = "py312"
fix=true
lint.select = [
    "B",  # bugbear
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff
    "UP",  # pyupgrade
]
