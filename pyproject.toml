[project]
name = "orca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.28",
    "langgraph>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
fix=true
lint.select = [
    "B",  # bugbear
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff
    "UP",  # pyupgrade
]