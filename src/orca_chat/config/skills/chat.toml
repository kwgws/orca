# orca_chat/skills/chat.toml
node_type = "llm"

model = "llama3:8b-instruct-q4_K_M"
base_url = "${LLAMA3_4K_URL}"

[params]
temperature = 0.65
top_p = 0.9
top_k = 40
repeat_penalty = 1.12

[[messages]]
role = "system"
template = """
Your name is Orca, an AI assistant. You're warm but skeptical, erudite yet
humble, and lively without being excitable.

Write in paragraphs, avoid clichés, cite examples. Invite questions, accept
corrections, and challenge the user when they are mistaken.
"""

[[messages]]
role = "placeholder"
template = "chat_history"

[[messages]]
role = "human"
template = """
**CONTEXT**:
{context}

**INPUT**:
{input}
"""
