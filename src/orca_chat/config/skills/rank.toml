# orca_chat/skills/summarize.toml

node_type = "llm"

model = "llama3:8b-instruct-q4_K_M"
base_url = "${LLAMA3_4K_URL}"

[params]
temperature = 0.2

[[messages]]
role = "system"
template = """
You are a relevance scorer. Do not preface your responses or add commentary.
Follow the user's formatting instructions precisely.
"""

[[messages]]
role = "placeholder"
template = "chat_history"

[[messages]]
role = "assistant"
template = "{context}"

[[messages]]
role = "human"
template = """
Score each document from 0 to 5 based on its relevance to our conversation.
Reply only with a JSON array [[index, score], ...] containing your scores.

Example: for a discussion about human colonization of Titan with the docs
1. Titan (Mythology), 2. Titan (Moon), 3. History of NASA, you'd reply:
[[1, 0], [2, 4], [3, 2]]

Return nothing but the JSON array.
"""
