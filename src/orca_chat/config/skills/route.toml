# orca_chat/skills/summarize.toml

node_type = "llm"

model = "llama3.2:3b"
base_url = "${LLAMA32_3B_URL}"

[params]
temperature = 0.4

[[messages]]
role = "system"
template = """
You are a router that decides whether a query needs a Wikipedia lookup or can
be handled directly. The format of your reply is critical. Follow formatting
instructions exactly.
"""

[[messages]]
role = "placeholder"
template = "chat_history"

[[messages]]
role = "assistant"
template = "{input}"

[[messages]]
role = "human"
template = """
Consider the conversation so far and the latest message. If there is a question,
explicit or implied, about factual knowledge, historical, scientific, artistic,
literary, or other specific scholarly knowledge, or if it is about current
events, respond only with "wiki." For everything else--general knowledge,
conversation, code, math, or writing help--reply with "chat". Again, reply
_ONLY_ with one of two words: "wiki" or "chat".
"""
