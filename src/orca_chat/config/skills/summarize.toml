# orca_chat/skills/summarize.toml
node_type = "llm"

model = "llama3.2:3b"
base_url = "${LLAMA32_3B_URL}"

[params]
temperature = 0.2

[[messages]]
role = "system"
template = """
You are a summarizer. Do not preface your responses or add commentary.
Provide only an accurate and useful summary.
"""

[[messages]]
role = "placeholder"
template = "chat_history"

[[messages]]
role = "human"
template = """
Summarize the conversation so far as a concise précis of no more than a
paragraph. Preserve key details and note any open questions.
"""
